<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeeStar Night Desk</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><p class="eyebrow">LOCAL TELESCOPE CONTROL</p><h1>SeeStar Night Desk</h1><p id="subtitle">Connecting to your S50…</p><p class="connection" id="connection">Checking control links…</p></div><button class="quiet" id="refresh">Refresh</button></header>
<section class="cards" id="cards"></section>
<section class="layout"><article class="panel"><h2>Point the telescope</h2><div class="preset"><button data-name="M33 Triangulum Galaxy" data-ra="1.5639" data-dec="30.6603">M33<br><small>Triangulum Galaxy</small></button><button data-name="M31 Andromeda Galaxy" data-ra="0.712" data-dec="41.269">M31<br><small>Andromeda Galaxy</small></button><button data-name="μ And → M31 mosaic" data-ra="0.8291" data-dec="39.884" data-mosaic="true">μ And → M31<br><small>4× wide mosaic</small></button></div><form id="goto"><label>Target name<input name="name" required placeholder="e.g. M33 Triangulum Galaxy"></label><div class="row"><label>RA (hours)<input name="ra" required type="number" step="0.0001" min="0" max="24"></label><label>Dec (degrees)<input name="dec" required type="number" step="0.0001" min="-90" max="90"></label></div><label class="toggle"><input name="lpFilter" type="checkbox"> Use light-pollution filter</label><label class="toggle"><input name="wideMosaic" type="checkbox"> 4× wide mosaic</label><button class="primary">Slew & plate-solve</button></form></article>
<article class="panel"><h2>Capture</h2><p class="hint">Slew first. Once the scope reports the target is live, start the stack.</p><div class="actions"><button id="fiveSecond">Use 5-second frames</button><button class="primary" id="stack">Start stack</button><button id="stop">Finish & save</button><button class="danger" id="park">Park telescope</button></div><p class="hint">“Finish & save” stops stacking while keeping the camera in live view.</p></article></section><p class="message" id="message" role="status"></p></main><script src="app.js"></script></body></html>
